name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK check
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test log parser
        run: |
          mkdir -p build/parser-test
          javac -d build/parser-test app/src/main/java/online/vaultx/playeridhelper/GameLogParser.java tests/GameLogParserTest.java
          java -cp build/parser-test online.vaultx.playeridhelper.GameLogParserTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: caseopener-playerid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish direct APK in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CaseOpenerPleerID.apk
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 CaseOpenerPleerID.apk --clobber
          else
            gh release create v0.2.0 CaseOpenerPleerID.apk \
              --title "CaseOpenerPleerID 0.2.0 — Log Scanner" \
              --notes "Экспериментальный поиск Player ID из Android logcat. Требуется ADB READ_LOGS; ID должен присутствовать в журнале игры. APK устанавливается отдельно и не изменяет оригинальную игру."
          fi
